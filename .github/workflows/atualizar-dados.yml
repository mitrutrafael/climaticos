name: Atualizar Dados Climáticos

on:
  schedule:
    - cron: '0 6 * * *'  # Diariamente às 06:00 UTC (03:00 BRT)
  workflow_dispatch:     # Permite execução manual (e backfill do histórico)
    inputs:
      start:
        description: 'Data inicial YYYY-MM-DD (vazio = últimos 30 dias)'
        required: false
        default: ''
      end:
        description: 'Data final YYYY-MM-DD (vazio = hoje)'
        required: false
        default: ''
      source:
        description: 'Fonte de dados'
        type: choice
        options: [todas, arable, davis]
        default: todas

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      ARABLE_API_KEY: ${{ secrets.ARABLE_API_KEY }}
      DAVIS_API_KEY: ${{ secrets.DAVIS_API_KEY }}
      DAVIS_API_SECRET: ${{ secrets.DAVIS_API_SECRET }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Executar pipeline ETL
        env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          args=(--log-level INFO)
          if [ -n "$START" ]; then
            args+=(--start "$START")
            if [ -n "$END" ]; then args+=(--end "$END"); fi
          else
            args+=(--days 30)
          fi
          case "$SOURCE" in
            arable) args+=(--arable-only) ;;
            davis)  args+=(--davis-only) ;;
          esac
          python main.py "${args[@]}"

      - name: Verificar mudanças
        id: changes
        run: |
          if git status --porcelain | grep -qE "dados_(climaticos|davis)_brasil\.csv"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push se houver mudanças
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_climaticos_brasil.csv dados_davis_brasil.csv
          git commit -m "chore: atualiza dados climáticos $(date +%Y-%m-%d)"
          git push